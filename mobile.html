<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0F766E"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>MediReport Mobile</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' rx='22' fill='white' stroke='%231a1a2e' stroke-width='6'/><polyline points='2,50 16,50 23,22 33,78 40,35 47,50 53,50 60,22 70,78 77,36 84,50 98,50' fill='none' stroke='%23E8001C' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;background:#F1F5F9;color:#0F172A;font-size:15px;line-height:1.5;min-height:100vh;overscroll-behavior:none}
:root{--blue:#0F766E;--blue-l:#F0FDFA;--blue-d:#115E59;--green:#16A34A;--green-l:#F0FDF4;--red:#E53935;--red-l:#FDECEA;--amber:#D97706;--amber-l:#FEF3C7;--g50:#FAFAF9;--g100:#F5F5F4;--g200:#E7E5E4;--g400:#A8A29E;--g500:#78716C;--g700:#44403C;--g900:#1C1917;--shadow-sm:0 1px 2px rgba(28,25,23,.04),0 2px 8px rgba(28,25,23,.04);--shadow-md:0 2px 4px rgba(28,25,23,.04),0 8px 24px rgba(28,25,23,.07)}

/* LOGIN */
#ls{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px;background:linear-gradient(160deg,#F7F6F3 0%,#EDF7F5 55%,#E4F3F0 100%);overflow-y:auto}
.l-ico{width:64px;height:64px;border-radius:18px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:20px auto 10px;box-shadow:none}
.l-tit{font-size:22px;font-weight:900;color:#0F172A;text-align:center;letter-spacing:-1px;margin-bottom:4px}
.l-sub{font-size:13px;color:#64748B;text-align:center;margin-bottom:20px}
.l-card{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
label{display:block;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.l-inp{width:100%;padding:13px 14px;border:2px solid #E2E8F0;border-radius:12px;font-size:16px;outline:none;background:#fff;margin-bottom:14px;font-family:inherit}
.l-inp:focus{border-color:var(--blue)}
.dots{display:flex;gap:10px;justify-content:center;margin:8px 0 14px}
.dot{width:14px;height:14px;border-radius:50%;background:#E2E8F0;transition:.15s}
.dot.on{background:var(--blue)}
.dot.err{background:var(--red)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.k{height:54px;border-radius:12px;background:#F8FAFC;border:2px solid #E2E8F0;font-size:22px;font-weight:700;color:#0F172A;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.k:active{background:#EAF1FF;border-color:var(--blue);transform:scale(.94)}
.k.ok{background:var(--blue);color:#fff;border-color:var(--blue)}
.perr{font-size:13px;color:var(--red);text-align:center;min-height:20px;font-weight:600;margin-top:4px}

/* APP */
#app{display:none;height:100vh;height:100dvh;flex-direction:column;overflow:hidden}
.hdr{background:linear-gradient(135deg,var(--blue),var(--blue-d));padding:16px 16px 20px;color:#fff}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hdr-logo{font-size:15px;font-weight:800;color:#fff}
.h-out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.p-card{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.p-av{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.p-name{font-size:19px;font-weight:900;color:#fff}
.p-meta{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.p-consent{font-size:11px;font-weight:700;margin-top:5px;background:rgba(255,255,255,.2);display:inline-block;padding:2px 10px;border-radius:99px;color:#fff}

/* TABS */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#fff;border-bottom:1px solid var(--g200);padding:4px 4px 6px;flex-shrink:0;position:sticky;top:0;z-index:50;box-shadow:0 4px 16px rgba(28,25,23,.05)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:12px;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);user-select:none;min-width:0}
.tab-i{font-size:20px;line-height:1;transition:transform .18s}
.tab-l{font-size:9.5px;font-weight:700;color:var(--g500);letter-spacing:.05px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--blue-l)}
.tab.on .tab-l{color:var(--blue)}
.tab.on .tab-i{transform:scale(1.12)}
.tab.on::before{content:"";position:absolute;top:-1px;width:18px;height:3px;background:var(--blue);border-radius:0 0 99px 99px}
.tab:active{transform:scale(.94)}

/* CONTENT */
.ct{flex:1;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stit{font-size:16px;font-weight:800;color:#0F172A;margin-bottom:10px}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ctit{font-size:13px;font-weight:800;color:#0F172A;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ii{background:#F8FAFC;border-radius:10px;padding:9px 11px}
.ilbl{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.ival{font-size:12px;font-weight:600;color:#0F172A}

/* BADGES */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.bgn{background:#F0FDF4;color:#16A34A}
.ba{background:#FEF3C7;color:#92400E}
.br{background:#FDECEA;color:#E53935}
.bb{background:#EAF1FF;color:var(--blue)}
.bgr{background:#F1F5F9;color:#64748B}

/* ALERTS */
.ale{display:flex;gap:9px;padding:10px 13px;border-radius:12px;margin-bottom:9px;align-items:flex-start;font-size:13px}
.ale-r{background:#FDECEA;border:1px solid #FECACA}
.ale-b{background:#EAF1FF;border:1px solid #BFDBFE}

/* LABO */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F8FAFC}
.lrow:last-child{border:none}
.lname{font-size:12px;color:#334155;flex:1}
.lval{font-size:13px;font-weight:800;margin:0 6px}
.lnorm{font-size:10px;color:#94A3B8}
.lok{color:#16A34A}.lwarn{color:#F59E0B}.lbad{color:#E53935}

/* RDV */
.rdvi{display:flex;gap:10px;padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rdvd{width:46px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0}

/* RX */
.rxi{display:flex;gap:10px;padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);align-items:flex-start}
.rxio{width:38px;height:38px;border-radius:9px;background:#EAF1FF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:#94A3B8}
.empty-i{font-size:48px;display:block;margin-bottom:12px}

/* ═══ THÈME PREMIUM MÉDICAL (aligné index_v2) ═══ */
.l-card{border-radius:20px;box-shadow:var(--shadow-md);border:1px solid var(--g100)}
.l-inp{border-radius:12px;border-color:var(--g200)}
.l-inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(15,118,110,.10)}
.pkey{border-radius:12px !important;transition:all .18s cubic-bezier(.4,0,.2,1)}
.pkey:active{transform:scale(.94);background:var(--blue-l) !important}
button{font-family:inherit}
.card,.c{border-radius:16px;box-shadow:var(--shadow-sm);border-color:var(--g100)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--g200);border-radius:99px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.tab-dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 3px;background:#E53935;color:#fff;font-size:9px;font-weight:800;border-radius:99px;display:flex;align-items:center;justify-content:center;line-height:1;border:1.5px solid #fff}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="ls">
  <div class="l-ico" style="padding:4px;overflow:hidden;box-shadow:none;border:none;background:transparent"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><rect x="1" y="1" width="98" height="98" rx="20" fill="white" stroke="#1a1a2e" stroke-width="1.5"/><polyline points="3,50 17,50 24,26 34,74 41,36 48,50 52,50 59,26 69,74 76,38 83,50 97,50" fill="none" stroke="#E8001C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="l-tit">MediReport <span style="color:var(--blue)">Mobile</span></div>
  <div class="l-sub">Mon dossier de santé</div>
  <div class="l-card">
    <label>Identifiant</label>
    <input id="uid" class="l-inp" type="text" placeholder="Ex : omar.benkirane" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <label>Code PIN</label>
    <div class="dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
      <div class="dot" id="d4"></div><div class="dot" id="d5"></div>
    </div>
    <div class="pgrid">
      <div class="k" onclick="p('1')">1</div><div class="k" onclick="p('2')">2</div><div class="k" onclick="p('3')">3</div>
      <div class="k" onclick="p('4')">4</div><div class="k" onclick="p('5')">5</div><div class="k" onclick="p('6')">6</div>
      <div class="k" onclick="p('7')">7</div><div class="k" onclick="p('8')">8</div><div class="k" onclick="p('9')">9</div>
      <div class="k" onclick="p('del')">⌫</div><div class="k" onclick="p('0')">0</div>
      <div class="k ok" onclick="login()">✓</div>
    </div>
    <div class="perr" id="perr"></div>
    <div style="text-align:center;font-size:11px;color:#94A3B8;margin-top:8px">🔒 Accès sécurisé CNDP&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;🇲🇦 Conçu au Maroc</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- Timeout warning -->
  <div id="timeout-banner" style="display:none;background:#FEF3C7;border-bottom:2px solid #FDE68A;padding:10px 16px;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0">
    <div style="font-size:13px;font-weight:600;color:#92400E">⏱ Session expire dans <strong><span id="timeout-count">120</span>s</strong></div>
    <button onclick="extendSession()" style="background:#92400E;color:#fff;border:none;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Rester connecté</button>
  </div>
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo" style="display:flex;align-items:center;gap:8px"><div style="width:26px;height:26px;border-radius:7px;background:white;padding:3px;overflow:hidden;flex-shrink:0"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><rect width="100" height="100" rx="22" fill="white"/><polyline points="5,50 17,50 24,28 34,72 41,38 48,50 52,50 59,28 69,72 76,40 83,50 95,50" fill="none" stroke="#E8001C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>MediReport Mobile</div>
      <button class="h-out" onclick="logout()">Déconnexion</button>
    </div>
    <div class="p-card" id="pcard">
      <div class="p-av" id="pav">?</div>
      <div>
        <div class="p-name" id="pnam">—</div>
        <div class="p-meta" id="pmet">—</div>
        <div id="pconsent"></div>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-t="syn" onclick="switchTab('syn',this)"><span class="tab-i">📋</span><span class="tab-l">Synthèse</span></div>
    <div class="tab" data-t="con" onclick="switchTab('con',this)"><span class="tab-i">🩺</span><span class="tab-l">Consultations</span></div>
    <div class="tab" data-t="lab" onclick="switchTab('lab',this)"><span class="tab-i">🧪</span><span class="tab-l">Laboratoire</span></div>
    <div class="tab" data-t="med" onclick="switchTab('med',this)"><span class="tab-i">💊</span><span class="tab-l">Médicaments</span></div>
    <div class="tab" data-t="rdv" onclick="switchTab('rdv',this)"><span class="tab-i">📅</span><span class="tab-l">Rendez-vous</span></div>
    <div class="tab" data-t="img" onclick="switchTab('img',this)"><span class="tab-i">🔬</span><span class="tab-l">Imagerie</span></div>
    <div class="tab" data-t="vax" onclick="switchTab('vax',this)"><span class="tab-i">💉</span><span class="tab-l">Vaccination</span></div>
    <div class="tab" data-t="car" id="tab-car" onclick="switchTab('car',this)" style="visibility:hidden"><span class="tab-i">📔</span><span class="tab-l">Carnet</span></div>
  </div>
  <div class="ct" id="ct"></div>
</div>

<script>
// ── Fonctions de tri ──────────────────────────────────────
function sortByDate(arr, field, asc) {
  field = field || 'date';
  return [].concat(arr||[]).sort(function(a,b){
    function pd(d){
      if(!d) return 0;
      var p=d.split("/");
      return p.length===3 ? new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0])).getTime() : 0;
    }
    var da=pd(a[field]), db=pd(b[field]);
    return asc ? da-db : db-da;
  });
}

function sortRdv(arr) {
  var months={Jan:0,Janv:0,Fév:1,Fevr:1,Mar:2,Mars:2,Avr:3,Mai:4,Jun:5,Juin:5,Jul:6,Juil:6,Aoû:7,Août:7,Aout:7,Sep:8,Sept:8,Oct:9,Nov:10,Déc:11,Dec:11};
  var now = new Date();
  return [].concat(arr||[]).sort(function(a,b){
    var ma=months[a.mo]!==undefined?months[a.mo]:0;
    var mb=months[b.mo]!==undefined?months[b.mo]:0;
    var da=new Date(now.getFullYear(),ma,parseInt(a.day)||1);
    var db=new Date(now.getFullYear(),mb,parseInt(b.day)||1);
    if(da-db!==0) return da-db;
    return (a.h||"").localeCompare(b.h||"");
  });
}

var DB = null, PAT = null, USR = null, pin = "";

function p(v) {
  if (v === "del") { pin = pin.slice(0,-1); }
  else if (pin.length < 6) { pin += v; }
  upd();
  // Login déclenché uniquement par le bouton OK ✓
}
function upd() {
  for (var i=0;i<6;i++) {
    var d=document.getElementById("d"+i);
    if(d) d.className="dot"+(i<pin.length?" on":"");
  }
}

// ═══ BADGES NON-LU (patient) ═════════════════════════════
var _seen = {};        // {item_type: [ids]}
var _seenBaseline = null;
var curTab = "syn";
var TAB_TYPE = {con:"el_consult", lab:"el_labo", med:"el_rx", rdv:"el_rdv", img:"el_img"};

function isSeenM(type, id){ return (_seen[type]||[]).indexOf(id) > -1; }

function markSeenM(type, id){
  if (isSeenM(type, id)) return;
  if (!_seen[type]) _seen[type] = [];
  _seen[type].push(id);
  fetch("/api/db", {method:"POST", headers:{"Content-Type":"application/json","x-session":TOKEN||""},
    body: JSON.stringify({path:"seen_items", method:"POST", body: JSON.stringify({user_id:USR.id, item_id:id, item_type:type})})
  }).catch(function(){});
}

function ensureBaselineM(){
  if (_seenBaseline) return;
  _seenBaseline = new Date().toISOString();
  fetch("/api/db", {method:"POST", headers:{"Content-Type":"application/json","x-session":TOKEN||""},
    body: JSON.stringify({path:"seen_items", method:"POST", body: JSON.stringify({user_id:USR.id, item_id:"__baseline__", item_type:"baseline"})})
  }).catch(function(){});
}

function isUnseenM(type, it){
  if (!it || !it.id || !it.at) return false;
  if (_seenBaseline && new Date(it.at) <= new Date(_seenBaseline)) return false;
  return !isSeenM(type, it.id);
}

function _itemsOfType(type){
  var pid = PAT ? PAT.id : null; if (!pid) return [];
  var src;
  if (type==="el_consult") src = DB.consultations[pid]||[];
  else if (type==="el_labo") src = DB.labos[pid]||[];
  else if (type==="el_rx") src = DB.rx[pid]||[];
  else if (type==="el_img") src = DB.imagerie[pid]||[];
  else if (type==="el_rdv") src = DB.rdv||[];
  else return [];
  return src.map(function(x){ return {id:x.id, at:x.created_at}; });
}

function updateMobileBadges(){
  for (var t in TAB_TYPE){
    var type = TAB_TYPE[t];
    var n = _itemsOfType(type).filter(function(it){ return isUnseenM(type, it); }).length;
    var tabEl = document.querySelector('.tab[data-t="'+t+'"]');
    if (!tabEl) continue;
    var dot = tabEl.querySelector(".tab-dot");
    if (n > 0){
      if (!dot){ dot = document.createElement("span"); dot.className = "tab-dot"; tabEl.appendChild(dot); }
      dot.textContent = n;
    } else if (dot){ dot.remove(); }
  }
}

function markTabSeen(tab){
  var type = TAB_TYPE[tab]; if (!type) return;
  _itemsOfType(type).forEach(function(it){ if (isUnseenM(type, it)) markSeenM(type, it.id); });
  updateMobileBadges();
}

function reloadPatientData(){
  if (!USR || !PAT || !TOKEN) return;
  var pid = PAT.id, done = 0, need = 6;
  function fin(){ done++; if (done >= need){ updateMobileBadges(); showTab(curTab); } }
  supaGet("prescriptions?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
    if(rows){ DB.rx[pid]=rows.map(function(rx){ return Object.assign({},rx,{patientId:rx.patient_id,s:rx.statut,ren:rx.renouvellement,ord:rx.ordonnance,a_vie:rx.a_vie||false,date_fin:rx.date_fin||null}); }); } fin();
  });
  supaGet("labos?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
    if(rows){ DB.labos[pid]=rows.map(function(l){ return Object.assign({},l,{patientId:l.patient_id,res:l.resultats||[]}); }); } fin();
  });
  supaGet("rdv?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
    if(rows){ DB.rdv=rows.map(function(r){return Object.assign({},r,{patientId:r.patient_id,s:r.statut,c:r.color});}); } fin();
  });
  supaGet("imagerie?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
    if(rows){ DB.imagerie[pid]=rows.map(function(i){ return Object.assign({},i,{patientId:i.patient_id,cr:i.conclusion,res:i.resultat,rc:i.resultat==="Normal"?"g":"a"}); }); } fin();
  });
  supaGet("consultations?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
    if(rows){ DB.consultations[pid]=rows; } fin();
  });
  supaGet("vaccins?patient_id=eq."+pid+"&select=*&order=created_at.asc", function(rows){
    if(rows){ DB.vaccins[pid]=rows; updateVaxBadge(); } fin();
  });
}

function login() {
  var id = document.getElementById("uid").value.trim().toLowerCase();
  var err = document.getElementById("perr");
  err.textContent = "";
  if (!id) { err.textContent = "Saisissez votre identifiant"; return; }
  if (pin.length < 6) { err.textContent = "Saisissez votre code PIN"; return; }

  err.style.color = "#0F766E";
  err.textContent = "Vérification…";

  // ── Authentification côté serveur ──
  fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ login: id, pin: pin })
  }).then(function(r){ return r.json().then(function(d){ return {ok: r.ok, data: d}; }); })
  .then(function(res){
    if (!res.ok) {

      err.style.color = "#DC2626";
      err.textContent = "Ce compte n'est pas un accès patient";
      pin = ""; upd();
      return;
    }

    TOKEN = res.data.token;
    USR = user; pin = "";

    // ── Compte famille : si des dossiers sont liés, proposer le choix ──
    if (user.linkedPatients && user.linkedPatients.length) {

  });
}

// ── ACCÈS SÉCURISÉ VIA PROXY /api/db ─────────────────────────
var TOKEN = null;

function _xssClean(v){
  if (typeof v === "string") return v.replace(/<(?=[a-zA-Z\/!])/g, "&lt;");
  if (Array.isArray(v)) return v.map(_xssClean);
  if (v && typeof v === "object"){ var o={}; for (var k in v) o[k]=_xssClean(v[k]); return o; }
  return v;
}

function supaGet(path, cb) {
  fetch("/api/db", {
    method: "POST",
    headers: {"Content-Type": "application/json", "x-session": TOKEN || ""},
    body: JSON.stringify({ path: path, method: "GET" })
  }).then(function(r){
    if (r.status === 401) { logout(); return null; }
    return r.json();
  }).then(function(data){ cb(_xssClean(data)); }).catch(function(){ cb(null); });
}

// ── SESSION TIMEOUT 10 min ────────────────────────────────────────
var sessionTimer = null;
var warnTimer = null;
var countdownInterval = null;
var _lastReset = 0;
var TIMEOUT = 15 * 60 * 1000;
var WARN_AT = 13 * 60 * 1000;

function resetTimer() {
  if (!USR) return;
  var now = Date.now();
  if (now - _lastReset < 1000) return; // throttle 1s
  _lastReset = now;

  clearTimeout(sessionTimer);
  clearTimeout(warnTimer);
  clearInterval(countdownInterval);
  var banner = document.getElementById("timeout-banner");
  if (banner) banner.style.display = "none";

  warnTimer = setTimeout(function() {
    if (!USR) return;
    var b = document.getElementById("timeout-banner");
    if (b) { b.style.display = "flex"; startCountdown(120); }
  }, WARN_AT);

  sessionTimer = setTimeout(function() {
    if (!USR) return;
    logout();
  }, TIMEOUT);
}

function startCountdown(s) {
  clearInterval(countdownInterval);
  var el = document.getElementById("timeout-count");
  if (!el) return;
  var v = s;
  el.textContent = v;
  countdownInterval = setInterval(function(){
    v--;
    if (v <= 0) { clearInterval(countdownInterval); return; }
    el.textContent = v;
  }, 1000);
}

function extendSession() {
  clearInterval(countdownInterval);
  var b = document.getElementById("timeout-banner");
  if (b) b.style.display = "none";
  _lastReset = 0;
  resetTimer();
}

["touchstart","click","keydown"].forEach(function(ev) {
  document.addEventListener(ev, function(){ if(USR) resetTimer(); }, {passive:true});
});

// ═══════════ MODULE VACCINATION + CARNET ═══════════
function _pFRv(s){ var m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m?new Date(+m[3],+m[2]-1,+m[1]):null; }
function _fmtFR(d){ return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }
function ageInfo(dob){
  var d=_pFRv(dob); if(!d) return {years:null,months:null,label:"—"};
  var now=new Date();
  var months=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());
  if(now.getDate()<d.getDate()) months--;
  var years=Math.floor(months/12);
  var label = months<24 ? months+" mois" : years+" ans";
  return {years:years, months:months, label:label};
}
function isMinorP(p){ var a=ageInfo(p&&p.dob); return a.months!==null && a.months<216; }

// Calendrier vaccinal marocain (référentiel indicatif — à valider médicalement)
var VAX_CHILD=[
  {code:"bcg",m:0,nom:"BCG",dose:"Dose unique"},
  {code:"hb",m:0,nom:"Hépatite B",dose:"Naissance"},
  {code:"vpo",m:0,nom:"VPO (Polio orale)",dose:"Naissance (VPO-0)"},
  {code:"penta",m:2,nom:"Pentavalent (DTC-Hib-HB)",dose:"1re dose"},
  {code:"vpo",m:2,nom:"VPO (Polio orale)",dose:"1re dose"},
  {code:"pneumo",m:2,nom:"Pneumocoque (PCV)",dose:"1re dose"},
  {code:"rota",m:2,nom:"Rotavirus",dose:"1re dose"},
  {code:"penta",m:3,nom:"Pentavalent (DTC-Hib-HB)",dose:"2e dose"},
  {code:"vpo",m:3,nom:"VPO (Polio orale)",dose:"2e dose"},
  {code:"pneumo",m:3,nom:"Pneumocoque (PCV)",dose:"2e dose"},
  {code:"rota",m:3,nom:"Rotavirus",dose:"2e dose"},
  {code:"penta",m:4,nom:"Pentavalent (DTC-Hib-HB)",dose:"3e dose"},
  {code:"vpo",m:4,nom:"VPO (Polio orale)",dose:"3e dose"},
  {code:"rr",m:9,nom:"Rougeole-Rubéole (RR)",dose:"1re dose"},
  {code:"pneumo",m:12,nom:"Pneumocoque (PCV)",dose:"Rappel 12 mois"},
  {code:"rr",m:18,nom:"Rougeole-Rubéole (RR)",dose:"2e dose"},
  {code:"dtc_r",m:18,nom:"DTC rappel",dose:"Rappel 18 mois"},
  {code:"vpo",m:18,nom:"VPO (Polio orale)",dose:"Rappel 18 mois"},
  {code:"dtc_r",m:60,nom:"DTC rappel",dose:"Rappel 5 ans"},
  {code:"vpo",m:60,nom:"VPO (Polio orale)",dose:"Rappel 5 ans"}
];

function buildVaxSchedule(p){
  var vax=(DB.vaccins&&DB.vaccins[p.id])||[];
  var done=vax.slice().sort(function(a,b){var da=_pFRv(a.date),db_=_pFRv(b.date);return (da&&db_)?da-db_:0;});
  var res={late:[],upcoming:[],done:done};
  var ai=ageInfo(p.dob), birth=_pFRv(p.dob), now=new Date();
  if(!birth) return res;

  function countDone(code){ return done.filter(function(v){return v.vac_code===code;}).length; }

  if(ai.months<216){
    // ENFANT : échéancier du calendrier — chaque ligne matchée dans l'ordre par code
    var seen={};
    VAX_CHILD.forEach(function(e){
      seen[e.code]=(seen[e.code]||0)+1;
      var idx=seen[e.code]; // n-ième occurrence de ce code
      var due=new Date(birth.getFullYear(),birth.getMonth()+e.m,birth.getDate());
      if(countDone(e.code)>=idx) return; // déjà fait
      var item={nom:e.nom,dose:e.dose,due:due,code:e.code};
      if(due<=now) res.late.push(item);
      else if(e.m<=ai.months+12) res.upcoming.push(item); // horizon 12 mois
    });
  } else {
    // ADULTE : recommandations
    var lastTet=done.filter(function(v){return v.vac_code==="dtc_r"||v.vac_code==="tetanos";}).pop();
    if(lastTet){
      var d=_pFRv(lastTet.date);
      if(d){ var due=new Date(d.getFullYear()+10,d.getMonth(),d.getDate());
        var item={nom:"Tétanos-diphtérie (dTP)",dose:"Rappel (tous les 10 ans)",due:due,code:"tetanos"};
        if(due<=now) res.late.push(item); else res.upcoming.push(item); }
    } else {
      res.late.push({nom:"Tétanos-diphtérie (dTP)",dose:"Rappel — date du dernier inconnue",due:null,code:"tetanos"});
    }
    var chronic=((p.pathologies||[]).concat(p.antecedents||[]).join(" ")).match(/diab|irc|r[ée]nal|dialys|asthme|bpco|cardi|immuno/i);
    if(chronic||ai.years>=65){
      var flu=done.filter(function(v){return v.vac_code==="grippe";}).pop();
      var fluD=flu?_pFRv(flu.date):null;
      var thisSeason=new Date(now.getFullYear(),9,1); // 1er octobre
      if(now>=thisSeason && (!fluD||fluD<thisSeason))
        res.late.push({nom:"Grippe saisonnière",dose:"Dose annuelle (recommandée : pathologie chronique)",due:thisSeason,code:"grippe"});
      else if(!fluD||fluD<thisSeason)
        res.upcoming.push({nom:"Grippe saisonnière",dose:"Dose annuelle (recommandée)",due:thisSeason,code:"grippe"});
    }
    if(!countDone("hb") && ((p.pathologies||[]).join(" ")).match(/irc|dialys/i))
      res.upcoming.push({nom:"Hépatite B",dose:"Schéma complet (recommandé : dialyse)",due:null,code:"hb"});
  }
  return res;
}

function tabVax(){
  var p=PAT, s=buildVaxSchedule(p);
  var h='';
  function row(it,cls,icon){
    var dueTxt=it.due?_fmtFR(it.due):"—";
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #E7E5E4">'+
      '<span style="font-size:18px">'+icon+'</span><div style="flex:1;min-width:0">'+
      '<div style="font-size:13.5px;font-weight:700">'+it.nom+'</div>'+

function tabCarnet(){
  var p=PAT, ai=ageInfo(p.dob);
  var cons=sortByDate(DB.consultations[p.id]||[], 'date', true); // asc
  var meas=[];
  cons.forEach(function(c){
    var ct=c.constantes||{};
    var w=parseFloat(String(ct["Poids"]||"").replace(",", "."));
    var t=parseFloat(String(ct["Taille"]||"").replace(",", "."));
    var pc=parseFloat(String(ct["PC"]||"").replace(",", "."));
    if(!isNaN(w)||!isNaN(t)||!isNaN(pc)) meas.push({date:c.date,w:isNaN(w)?null:w,t:isNaN(t)?null:t,pc:isNaN(pc)?null:pc});
  });
  var h='<div class="card"><div class="ctit">📔 Carnet de santé</div>'+
    '<div style="font-size:13px"><b>'+p.prenom+' '+p.nom+'</b> · '+ai.label+'</div>'+
    '<div style="font-size:11.5px;color:#78716C;margin-top:3px">Né(e) le '+(p.dob||"—")+(p.groupe?' · Groupe '+p.groupe:'')+'</div></div>';

  function spark(vals,color,unit,title){
    var pts=vals.filter(function(v){return v.v!==null;});
    if(pts.length<1) return '';
    var last=pts[pts.length-1];
    var line='';
    if(pts.length>=2){
      var vmin=Math.min.apply(null,pts.map(function(x){return x.v;})),vmax=Math.max.apply(null,pts.map(function(x){return x.v;}));
      var rng=(vmax-vmin)||1, sw=180, sh=44;
      line='<svg viewBox="0 0 '+sw+' '+sh+'" style="width:100%;height:44px"><polyline points="'+
        pts.map(function(pp,i){return (i*sw/(pts.length-1)).toFixed(1)+","+((sh-4-(pp.v-vmin)/rng*(sh-8))).toFixed(1);}).join(" ")+
        '" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round"/></svg>';
    }
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">'+
      '<b style="font-size:13px">'+title+'</b><span style="font-family:monospace;font-weight:800;font-size:15px;color:'+color+'">'+last.v+' '+unit+'</span></div>'+
      line+'<div style="font-size:10px;color:#A8A29E">'+pts.length+' mesure'+(pts.length>1?'s':'')+' · dernière : '+last.d+'</div></div>';
  }
  h+=spark(meas.map(function(m){return {v:m.w,d:m.date};}),'#0F766E','kg','⚖️ Poids');
  h+=spark(meas.map(function(m){return {v:m.t,d:m.date};}),'#1A6EFF','cm','📏 Taille');
  h+=spark(meas.map(function(m){return {v:m.pc,d:m.date};}),'#7C3AED','cm','⭕ Périmètre crânien');
  if(!meas.length) h+='<div class="card" style="text-align:center;color:#78716C;font-size:12.5px">Les mesures (poids, taille, PC) apparaîtront ici au fil des consultations pédiatriques.</div>';

  var devs=cons.filter(function(c){return c.constantes&&c.constantes["Développement"];});
  if(devs.length){
    var lastD=devs[devs.length-1];
    h+='<div class="card"><div class="ctit">🚼 Développement</div><div style="font-size:13px">'+lastD.constantes["Développement"]+'</div>'+
      '<div style="font-size:10.5px;color:#A8A29E;margin-top:3px">Évalué le '+lastD.date+'</div></div>';
  }
  h+='<div style="font-size:10px;color:#A8A29E;text-align:center;margin-top:8px">Courbes de référence OMS (percentiles) : prochaine évolution.</div>';
  return h;
}

function toggleCon(el){
  var bid=el.getAttribute("data-target");

  if(!body) return;

    body.style.display="block";
    if(arr) arr.style.transform="rotate(180deg)";
  } else {
    body.style.display="none";
    if(arr) arr.style.transform="";
  }
}

function tabRdv() {
  var months = {Jan:0,Fév:1,Mar:2,Avr:3,Mai:4,Jun:5,Jul:6,Juil:6,Aoû:7,Août:7,Sep:8,Oct:9,Nov:10,Déc:11};
  var now = new Date();
  var all = (DB.rdv||[]).filter(function(r){ return r.patientId===PAT.id; });
  // Filter future RDV only (compare date + time)
  var rdvs = all.filter(function(r){
    var mo = months[r.mo];
    if(mo===undefined) return true;
    var hParts = (r.h||"00h00").replace("h",":").split(":");
    var d = new Date(now.getFullYear(), mo, parseInt(r.day)||1, parseInt(hParts[0])||0, parseInt(hParts[1])||0);
    return d > now;
  });
  // Sort by date then time
  rdvs.sort(function(a,b){
    var da = new Date(now.getFullYear(), months[a.mo]||0, parseInt(a.day)||1);
    var db2 = new Date(now.getFullYear(), months[b.mo]||0, parseInt(b.day)||1);
    if(da-db2 !== 0) return da-db2;
    return (a.h||"").localeCompare(b.h||"");
  });
  if(!rdvs.length) return emp("📅","Aucun rendez-vous à venir");
  var h='<div class="stit">Prochains rendez-vous ('+rdvs.length+')</div>';
  rdvs.forEach(function(r){
    var drU=DB.users.find(function(u){return u.id===r.dr;});
    var drRole=drU?drU.role:"";
    var drName=drU
      ? (["laboratoire","imagerie","pharmacie"].includes(drRole)
          ? (drU.structure||drU.nom)
          : (drU.titre||"Dr.")+" "+(drU.prenom||"")+" "+drU.nom)
      : "—";
    h+='<div class="rdvi"><div class="rdvd" style="background:'+(r.c||"var(--blue)")+'" ><div style="font-size:18px;font-weight:900;line-height:1">'+r.day+'</div><div style="font-size:9px;opacity:.85">'+r.mo+'</div></div><div style="flex:1"><div style="font-size:13px;font-weight:700">'+drName+'</div><div style="font-size:12px;color:var(--blue);font-weight:600;margin-top:1px">'+r.spec+'</div><div style="font-size:12px;color:#64748B;margin-top:1px">'+r.h+' · '+r.motif+'</div><div style="font-size:11px;color:#94A3B8;margin-top:1px">'+(r.lieu||"")+'</div></div>'+bdg("✓ Confirmé","bgn")+'</div>';
  });
  return h;
}

function tabImg() {

function printBilanMobile() {
  var p = PAT;

  var img_count = DB.imagerie && DB.imagerie[p.id] ? DB.imagerie[p.id].length : 0;
  var rx_count = DB.rx && DB.rx[p.id] ? DB.rx[p.id].length : 0;
  var hasData = cons_count > 0 || lab_count > 0 || img_count > 0 || rx_count > 0;
  if (!hasData) {
    var pid = p.id;

      loaded++;
      if (loaded >= total) printBilanMobile();

    supaGet("consultations?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.consultations=DB.consultations||{}; DB.consultations[pid]=rows; }

  html += cons.length ? cons.map(function(c){
    var drNom = (function(id){ var u=DB.users.find(function(x){return x.id===id;}); return u?((u.titre?u.titre+" ":"")+u.prenom+" "+u.nom):id; })(c.dr||"");
    return '<div class="card"><div class="card-date">'+c.date+' · '+drNom+' · '+(c.spec||"")+'</div><div class="card-title">'+(c.motif||"")+'</div><div class="card-body">'+(c.cr||"")+'</div></div>';
  }).join("") : '<div style="color:#94A3B8;font-size:10px">Aucune consultation</div>';

  // Labos
  html += '<div class="sec-title">Derniers résultats labo</div>';
  html += labos.length ? labos.map(function(l){
    var res = l.res||l.resultats||[];
    var laboNom = (function(id){ var u=DB.users.find(function(x){return x.id===id;}); return u?(u.structure||u.nom||id):id; })(l.labo||l.ref||"");
    return '<div class="card"><div class="card-date">'+l.date+' · '+laboNom+'</div>'
      +res.map(function(r){return '<div style="display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px solid #F1F5F9"><span>'+r.p+'</span><span class="'+(r.s==="bad"?"res-bad":r.s==="warn"?"res-warn":"res-ok")+'">'+r.v+' '+r.u+' <span style="color:#94A3B8">('+r.n+')</span></span></div>';}).join("")
      +'</div>';
  }).join("") : '<div style="color:#94A3B8;font-size:10px">Aucun résultat labo</div>';

  // Imagerie
  html += '<div class="sec-title">Imagerie</div>';
  html += imgs.length ? imgs.map(function(i){
    var centreNom = (function(id){ var u=DB.users.find(function(x){return x.id===id;}); return u?(u.structure||u.nom||id):id; })(i.centre||"");
    return '<div class="card"><div class="card-date">'+i.date+' · '+centreNom+'</div><div class="card-title">'+(i.type||"")+'</div><div class="card-body">'+(i.conclusion||i.cr||"")+'</div></div>';
  }).join("") : '<div style="color:#94A3B8;font-size:10px">Aucune imagerie</div>';

  // Prochain RDV
  if(nextRdv){
    html += '<div class="sec-title">Prochain rendez-vous</div>'
      +'<div class="rdv-box"><div style="font-size:12px;font-weight:700">📅 '+nextRdv.day+' '+nextRdv.mo+' à '+nextRdv.h+'</div>'
      +'<div style="font-size:10px;color:#475569;margin-top:2px">'+(nextRdv.spec||"")+' · '+(nextRdv.lieu||"")+'</div>'
      +'<div style="font-size:10px;color:#64748B">'+(nextRdv.motif||"")+'</div></div>';
  }

  html += '<div class="footer">MediReport · 🇲🇦 Conçu au Maroc · Document confidentiel · Usage médical uniquement · '+todayStr+'</div>';
  html += '</body></html>';

  // Ouvrir dans la même fenêtre pour éviter le blocage mobile
  // Affichage DANS l'app (pas de nouvel onglet — évite la croix Chrome qui fait sortir)
  var ov = document.createElement("div");
  ov.id = "bilan-overlay";
  ov.style.cssText = "position:fixed;inset:0;z-index:10000;background:#fff;display:flex;flex-direction:column";
  var bar = document.createElement("div");
  bar.style.cssText = "flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#0F766E;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)";
  bar.innerHTML = '<button onclick="document.getElementById(\'bilan-overlay\').remove()" style="background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;font-family:inherit">← Retour</button><b style="flex:1;font-size:14px">Mon bilan complet</b>';
  var fr = document.createElement("iframe");
  fr.style.cssText = "flex:1;border:none;width:100%;background:#fff";
  ov.appendChild(bar);
  ov.appendChild(fr);
  document.body.appendChild(ov);
  fr.srcdoc = html;
}

// ── PWA : enregistrement du service worker ──
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}
</script>
