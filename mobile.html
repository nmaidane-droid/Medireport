<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0F766E"/>
<title>MediReport Mobile</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' rx='22' fill='white' stroke='%231a1a2e' stroke-width='6'/><polyline points='2,50 16,50 23,22 33,78 40,35 47,50 53,50 60,22 70,78 77,36 84,50 98,50' fill='none' stroke='%23E8001C' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;background:#F1F5F9;color:#0F172A;font-size:15px;line-height:1.5;min-height:100vh}
:root{--blue:#0F766E;--blue-l:#F0FDFA;--blue-d:#115E59;--green:#16A34A;--green-l:#F0FDF4;--red:#E53935;--red-l:#FDECEA;--amber:#D97706;--amber-l:#FEF3C7;--g50:#FAFAF9;--g100:#F5F5F4;--g200:#E7E5E4;--g400:#A8A29E;--g500:#78716C;--g700:#44403C;--g900:#1C1917;--shadow-sm:0 1px 2px rgba(28,25,23,.04),0 2px 8px rgba(28,25,23,.04);--shadow-md:0 2px 4px rgba(28,25,23,.04),0 8px 24px rgba(28,25,23,.07)}

/* LOGIN */
#ls{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px;background:linear-gradient(160deg,#F7F6F3 0%,#EDF7F5 55%,#E4F3F0 100%);overflow-y:auto}
.l-ico{width:64px;height:64px;border-radius:18px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:20px auto 10px;box-shadow:none}
.l-tit{font-size:22px;font-weight:900;color:#0F172A;text-align:center;letter-spacing:-1px;margin-bottom:4px}
.l-sub{font-size:13px;color:#64748B;text-align:center;margin-bottom:20px}
.l-card{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
label{display:block;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.l-inp{width:100%;padding:13px 14px;border:2px solid #E2E8F0;border-radius:12px;font-size:16px;outline:none;background:#fff;margin-bottom:14px;font-family:inherit}
.l-inp:focus{border-color:var(--blue)}
.dots{display:flex;gap:10px;justify-content:center;margin:8px 0 14px}
.dot{width:14px;height:14px;border-radius:50%;background:#E2E8F0;transition:.15s}
.dot.on{background:var(--blue)}
.dot.err{background:var(--red)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.k{height:54px;border-radius:12px;background:#F8FAFC;border:2px solid #E2E8F0;font-size:22px;font-weight:700;color:#0F172A;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.k:active{background:#EAF1FF;border-color:var(--blue);transform:scale(.94)}
.k.ok{background:var(--blue);color:#fff;border-color:var(--blue)}
.perr{font-size:13px;color:var(--red);text-align:center;min-height:20px;font-weight:600;margin-top:4px}

/* APP */
#app{display:none;min-height:100vh;flex-direction:column}
.hdr{background:linear-gradient(135deg,var(--blue),var(--blue-d));padding:16px 16px 20px;color:#fff}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hdr-logo{font-size:15px;font-weight:800;color:#fff}
.h-out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.p-card{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.p-av{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.p-name{font-size:19px;font-weight:900;color:#fff}
.p-meta{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.p-consent{font-size:11px;font-weight:700;margin-top:5px;background:rgba(255,255,255,.2);display:inline-block;padding:2px 10px;border-radius:99px;color:#fff}

/* TABS */
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #E2E8F0;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 8px;font-size:10px;font-weight:700;color:#94A3B8;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;flex-shrink:0;transition:.15s;user-select:none;flex:1;min-width:0}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab-i{font-size:17px}

/* CONTENT */
.ct{flex:1;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stit{font-size:16px;font-weight:800;color:#0F172A;margin-bottom:10px}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ctit{font-size:13px;font-weight:800;color:#0F172A;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ii{background:#F8FAFC;border-radius:10px;padding:9px 11px}
.ilbl{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.ival{font-size:12px;font-weight:600;color:#0F172A}

/* BADGES */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.bgn{background:#F0FDF4;color:#16A34A}
.ba{background:#FEF3C7;color:#92400E}
.br{background:#FDECEA;color:#E53935}
.bb{background:#EAF1FF;color:var(--blue)}
.bgr{background:#F1F5F9;color:#64748B}

/* ALERTS */
.ale{display:flex;gap:9px;padding:10px 13px;border-radius:12px;margin-bottom:9px;align-items:flex-start;font-size:13px}
.ale-r{background:#FDECEA;border:1px solid #FECACA}
.ale-b{background:#EAF1FF;border:1px solid #BFDBFE}

/* LABO */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F8FAFC}
.lrow:last-child{border:none}
.lname{font-size:12px;color:#334155;flex:1}
.lval{font-size:13px;font-weight:800;margin:0 6px}
.lnorm{font-size:10px;color:#94A3B8}
.lok{color:#16A34A}.lwarn{color:#F59E0B}.lbad{color:#E53935}

/* RDV */
.rdvi{display:flex;gap:10px;padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rdvd{width:46px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0}

/* RX */
.rxi{display:flex;gap:10px;padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);align-items:flex-start}
.rxio{width:38px;height:38px;border-radius:9px;background:#EAF1FF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:#94A3B8}
.empty-i{font-size:48px;display:block;margin-bottom:12px}

/* ═══ THÈME PREMIUM MÉDICAL (aligné index_v2) ═══ */
.l-card{border-radius:20px;box-shadow:var(--shadow-md);border:1px solid var(--g100)}
.l-inp{border-radius:12px;border-color:var(--g200)}
.l-inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(15,118,110,.10)}
.pkey{border-radius:12px !important;transition:all .18s cubic-bezier(.4,0,.2,1)}
.pkey:active{transform:scale(.94);background:var(--blue-l) !important}
button{font-family:inherit}
.tab{border-radius:12px;font-weight:700;transition:all .18s cubic-bezier(.4,0,.2,1)}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.30)}
.card,.c{border-radius:16px;box-shadow:var(--shadow-sm);border-color:var(--g100)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--g200);border-radius:99px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="ls">
  <div class="l-ico" style="padding:4px;overflow:hidden;box-shadow:none;border:none;background:transparent"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><rect x="1" y="1" width="98" height="98" rx="20" fill="white" stroke="#1a1a2e" stroke-width="1.5"/><polyline points="3,50 17,50 24,26 34,74 41,36 48,50 52,50 59,26 69,74 76,38 83,50 97,50" fill="none" stroke="#E8001C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="l-tit">MediReport <span style="color:var(--blue)">Mobile</span></div>
  <div class="l-sub">Mon dossier de santé</div>
  <div class="l-card">
    <label>Identifiant</label>
    <input id="uid" class="l-inp" type="text" placeholder="Ex : omar.benkirane" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <label>Code PIN</label>
    <div class="dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
      <div class="dot" id="d4"></div><div class="dot" id="d5"></div>
    </div>
    <div class="pgrid">
      <div class="k" onclick="p('1')">1</div><div class="k" onclick="p('2')">2</div><div class="k" onclick="p('3')">3</div>
      <div class="k" onclick="p('4')">4</div><div class="k" onclick="p('5')">5</div><div class="k" onclick="p('6')">6</div>
      <div class="k" onclick="p('7')">7</div><div class="k" onclick="p('8')">8</div><div class="k" onclick="p('9')">9</div>
      <div class="k" onclick="p('del')">⌫</div><div class="k" onclick="p('0')">0</div>
      <div class="k ok" onclick="login()">✓</div>
    </div>
    <div class="perr" id="perr"></div>
    <div style="text-align:center;font-size:11px;color:#94A3B8;margin-top:8px">🔒 Accès sécurisé — CNDP Maroc</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- Timeout warning -->
  <div id="timeout-banner" style="display:none;background:#FEF3C7;border-bottom:2px solid #FDE68A;padding:10px 16px;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0">
    <div style="font-size:13px;font-weight:600;color:#92400E">⏱ Session expire dans <strong><span id="timeout-count">120</span>s</strong></div>
    <button onclick="extendSession()" style="background:#92400E;color:#fff;border:none;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Rester connecté</button>
  </div>
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo" style="display:flex;align-items:center;gap:8px"><div style="width:26px;height:26px;border-radius:7px;background:white;padding:3px;overflow:hidden;flex-shrink:0"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><rect width="100" height="100" rx="22" fill="white"/><polyline points="2,50 16,50 23,22 33,78 40,35 47,50 53,50 60,22 70,78 77,36 84,50 98,50" fill="none" stroke="#E8001C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>MediReport Mobile</div>
      <button class="h-out" onclick="logout()">Déconnexion</button>
    </div>
    <div class="p-card">
      <div class="p-av" id="pav">?</div>
      <div>
        <div class="p-name" id="pnam">—</div>
        <div class="p-meta" id="pmet">—</div>
        <div id="pconsent"></div>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" onclick="switchTab('syn',this)"><span class="tab-i">📋</span>Résumé</div>
    <div class="tab" onclick="switchTab('con',this)"><span class="tab-i">🩺</span>Consultations</div>
    <div class="tab" onclick="switchTab('lab',this)"><span class="tab-i">🧪</span>Labo</div>
    <div class="tab" onclick="switchTab('med',this)"><span class="tab-i">💊</span>Médicaments</div>
    <div class="tab" onclick="switchTab('rdv',this)"><span class="tab-i">📅</span>RDV</div>
    <div class="tab" onclick="switchTab('img',this)"><span class="tab-i">🔬</span>Imagerie</div>
  </div>
  <div class="ct" id="ct"></div>
</div>

<script>
// ── Fonctions de tri ──────────────────────────────────────
function sortByDate(arr, field, asc) {
  field = field || 'date';
  return [].concat(arr||[]).sort(function(a,b){
    function pd(d){
      if(!d) return 0;
      var p=d.split("/");
      return p.length===3 ? new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0])).getTime() : 0;
    }
    var da=pd(a[field]), db=pd(b[field]);
    return asc ? da-db : db-da;
  });
}

function sortRdv(arr) {
  var months={Jan:0,Janv:0,Fév:1,Fevr:1,Mar:2,Mars:2,Avr:3,Mai:4,Jun:5,Juin:5,Jul:6,Juil:6,Aoû:7,Août:7,Aout:7,Sep:8,Sept:8,Oct:9,Nov:10,Déc:11,Dec:11};
  var now = new Date();
  return [].concat(arr||[]).sort(function(a,b){
    var ma=months[a.mo]!==undefined?months[a.mo]:0;
    var mb=months[b.mo]!==undefined?months[b.mo]:0;
    var da=new Date(now.getFullYear(),ma,parseInt(a.day)||1);
    var db=new Date(now.getFullYear(),mb,parseInt(b.day)||1);
    if(da-db!==0) return da-db;
    return (a.h||"").localeCompare(b.h||"");
  });
}

var DB = null, PAT = null, USR = null, pin = "";

function p(v) {
  if (v === "del") { pin = pin.slice(0,-1); }
  else if (pin.length < 6) { pin += v; }
  upd();
  // Login déclenché uniquement par le bouton OK ✓
}
function upd() {
  for (var i=0;i<6;i++) {
    var d=document.getElementById("d"+i);
    if(d) d.className="dot"+(i<pin.length?" on":"");
  }
}

function login() {
  var id = document.getElementById("uid").value.trim().toLowerCase();
  var err = document.getElementById("perr");
  err.textContent = "";
  if (!id) { err.textContent = "Saisissez votre identifiant"; return; }
  if (pin.length < 6) { err.textContent = "Saisissez votre code PIN"; return; }

  err.style.color = "#0F766E";
  err.textContent = "Vérification…";

  // ── Authentification côté serveur ──
  fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ login: id, pin: pin })
  }).then(function(r){ return r.json().then(function(d){ return {ok: r.ok, data: d}; }); })
  .then(function(res){
    if (!res.ok) {
      err.style.color = "#DC2626";
      err.textContent = res.data.error || "Échec de connexion";
      pin = ""; upd(); flash();
      return;
    }
    var user = res.data.user;
    if (user.role !== "patient" || !user.patientId) {
      err.style.color = "#DC2626";
      err.textContent = "Ce compte n'est pas un accès patient";
      pin = ""; upd();
      return;
    }

    TOKEN = res.data.token;
    USR = user; pin = "";
    var pid = user.patientId;

    // ── Écran de chargement ──
    document.getElementById("ls").style.display = "none";
    var loadingDiv = document.createElement("div");
    loadingDiv.id = "loading-screen";
    loadingDiv.style.cssText = "position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px";
    loadingDiv.innerHTML = '<svg width="56" height="56" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="20" fill="white" stroke="#1a1a2e" stroke-width="4"/><polyline points="2,50 16,50 23,22 33,78 40,35 47,50 53,50 60,22 70,78 77,36 84,50 98,50" fill="none" stroke="#E8001C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '<div style="font-size:18px;font-weight:800;color:#0F172A">MediReport Mobile</div>'
      + '<div style="font-size:14px;color:#64748B">Chargement de votre dossier...</div>'
      + '<div style="width:200px;height:4px;background:#F1F5F9;border-radius:99px;overflow:hidden"><div id="load-bar" style="height:100%;width:0%;background:#0F766E;border-radius:99px;transition:width .3s"></div></div>';
    document.body.appendChild(loadingDiv);

    // ── Charger UNIQUEMENT son dossier (le serveur force le filtre de toute façon) ──
    DB = {users:[user], patients:[], consultations:{}, labos:{}, rx:{}, rdv:[], imagerie:{}, access:[]};
    var loaded = 0, total = 6;

    function updateBar(){ loaded++; var pct=(loaded/total*100); var lb=document.getElementById("load-bar"); if(lb) lb.style.width=pct+"%"; if(loaded>=total) launchApp(); }

    function launchApp(){
      if (!PAT) {
        var ls0 = document.getElementById("loading-screen");
        if(ls0) ls0.remove();
        document.getElementById("ls").style.display = "flex";
        err.style.color = "#DC2626";
        err.textContent = "Dossier introuvable — contactez votre médecin";
        return;
      }
      var ls1 = document.getElementById("loading-screen");
      if(ls1) ls1.remove();
      document.getElementById("app").style.display = "flex";
      document.getElementById("app").style.flexDirection = "column";
      buildHeader();
      showTab("syn");
      resetTimer();
    }

    supaGet("patients?id=eq."+pid+"&select=*", function(rows){
      if(rows&&rows[0]){ PAT=Object.assign({},rows[0],{userId:rows[0].user_id}); DB.patients=[PAT]; }
      updateBar();
    });
    supaGet("prescriptions?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.rx[pid]=rows.map(function(rx){ return Object.assign({},rx,{patientId:rx.patient_id,s:rx.statut,ren:rx.renouvellement,ord:rx.ordonnance,a_vie:rx.a_vie||false,date_fin:rx.date_fin||null}); }); }
      updateBar();
    });
    supaGet("labos?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.labos[pid]=rows.map(function(l){ return Object.assign({},l,{patientId:l.patient_id,res:l.resultats||[]}); }); }
      updateBar();
    });
    supaGet("rdv?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.rdv=rows.map(function(r){return Object.assign({},r,{patientId:r.patient_id,s:r.statut,c:r.color});}); }
      updateBar();
    });
    supaGet("imagerie?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.imagerie[pid]=rows.map(function(i){ return Object.assign({},i,{patientId:i.patient_id,cr:i.conclusion,res:i.resultat,rc:i.resultat==="Normal"?"g":"a"}); }); }
      updateBar();
    });
    supaGet("consultations?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.consultations[pid]=rows; }
      updateBar();
    });
  }).catch(function(){
    err.style.color = "#DC2626";
    err.textContent = "Service indisponible — vérifiez votre connexion";
  });
}


// ── ACCÈS SÉCURISÉ VIA PROXY /api/db ─────────────────────────
var TOKEN = null;

function _xssClean(v){
  if (typeof v === "string") return v.replace(/<(?=[a-zA-Z\/!])/g, "&lt;");
  if (Array.isArray(v)) return v.map(_xssClean);
  if (v && typeof v === "object"){ var o={}; for (var k in v) o[k]=_xssClean(v[k]); return o; }
  return v;
}

function supaGet(path, cb) {
  fetch("/api/db", {
    method: "POST",
    headers: {"Content-Type": "application/json", "x-session": TOKEN || ""},
    body: JSON.stringify({ path: path, method: "GET" })
  }).then(function(r){
    if (r.status === 401) { logout(); return null; }
    return r.json();
  }).then(function(data){ cb(_xssClean(data)); }).catch(function(){ cb(null); });
}

function startRealtimeMobile() {
  // Realtime remplacé par un rafraîchissement périodique (RLS actif).
  if (window._mobilePoll) clearInterval(window._mobilePoll);
  window._mobilePoll = setInterval(function(){
    if (USR && TOKEN && document.visibilityState === "visible") refreshPatientData();
  }, 90000);
}

function flash() {
  for (var i=0;i<6;i++) { var d=document.getElementById("d"+i); if(d) d.className="dot err"; }
  pin = "";
  setTimeout(function(){ for(var i=0;i<6;i++){ var d=document.getElementById("d"+i); if(d) d.className="dot"; } }, 800);
}

function logout() {
  clearTimeout(sessionTimer);
  clearTimeout(warnTimer);
  clearInterval(countdownInterval);
  USR=null; PAT=null; pin=""; DB=null; TOKEN=null;
  try { localStorage.removeItem("medirecord_db"); } catch(e) {}
  document.getElementById("uid").value="";
  upd();
  document.getElementById("perr").textContent="";
  document.getElementById("ls").style.display="flex";

// ── SESSION TIMEOUT 10 min ────────────────────────────────────────
var sessionTimer = null;
var warnTimer = null;
var countdownInterval = null;
var _lastReset = 0;
var TIMEOUT = 15 * 60 * 1000;
var WARN_AT = 13 * 60 * 1000;

function resetTimer() {
  if (!USR) return;
  var now = Date.now();
  if (now - _lastReset < 1000) return; // throttle 1s
  _lastReset = now;

  clearTimeout(sessionTimer);
  clearTimeout(warnTimer);
  clearInterval(countdownInterval);
  var banner = document.getElementById("timeout-banner");
  if (banner) banner.style.display = "none";

  warnTimer = setTimeout(function() {
    if (!USR) return;
    var b = document.getElementById("timeout-banner");
    if (b) { b.style.display = "flex"; startCountdown(120); }
  }, WARN_AT);

  sessionTimer = setTimeout(function() {
    if (!USR) return;
    logout();
  }, TIMEOUT);
}

function startCountdown(s) {
  clearInterval(countdownInterval);
  var el = document.getElementById("timeout-count");
  if (!el) return;
  var v = s;
  el.textContent = v;
  countdownInterval = setInterval(function(){
    v--;
    if (v <= 0) { clearInterval(countdownInterval); return; }
    el.textContent = v;
  }, 1000);
}

function extendSession() {
  clearInterval(countdownInterval);
  var b = document.getElementById("timeout-banner");
  if (b) b.style.display = "none";
  _lastReset = 0;
  resetTimer();
}

["touchstart","click","keydown"].forEach(function(ev) {
  document.addEventListener(ev, function(){ if(USR) resetTimer(); }, {passive:true});
});

  rdvs.sort(function(a,b){
    var da = new Date(now.getFullYear(), months[a.mo]||0, parseInt(a.day)||1);
    var db2 = new Date(now.getFullYear(), months[b.mo]||0, parseInt(b.day)||1);
    if(da-db2 !== 0) return da-db2;
    return (a.h||"").localeCompare(b.h||"");
  });
  if(!rdvs.length) return emp("📅","Aucun rendez-vous à venir");
  var h='<div class="stit">Prochains rendez-vous ('+rdvs.length+')</div>';
  rdvs.forEach(function(r){
    var drU=DB.users.find(function(u){return u.id===r.dr;});
    var drRole=drU?drU.role:"";
    var drName=drU
      ? (["laboratoire","imagerie","pharmacie"].includes(drRole)
          ? (drU.structure||drU.nom)
          : (drU.titre||"Dr.")+" "+(drU.prenom||"")+" "+drU.nom)
      : "—";
    h+='<div class="rdvi"><div class="rdvd" style="background:'+(r.c||"var(--blue)")+'" ><div style="font-size:18px;font-weight:900;line-height:1">'+r.day+'</div><div style="font-size:9px;opacity:.85">'+r.mo+'</div></div><div style="flex:1"><div style="font-size:13px;font-weight:700">'+drName+'</div><div style="font-size:12px;color:var(--blue);font-weight:600;margin-top:1px">'+r.spec+'</div><div style="font-size:12px;color:#64748B;margin-top:1px">'+r.h+' · '+r.motif+'</div><div style="font-size:11px;color:#94A3B8;margin-top:1px">'+(r.lieu||"")+'</div></div>'+bdg("✓ Confirmé","bgn")+'</div>';
  });
  return h;
}

function tabImg() {
  var imgs=sortByDate(DB.imagerie[PAT.id]||[], 'date', false);
  if(!imgs.length) return emp("🔬","Aucun examen d'imagerie");
  // Sort by date descending
  var months={Jan:0,Fév:1,Mar:2,Avr:3,Mai:4,Jun:5,Jul:6,Juil:6,Aoû:7,Août:7,Sep:8,Oct:9,Nov:10,Déc:11};
  imgs = imgs.slice().sort(function(a,b){
    // date format: JJ/MM/AAAA
    var pa=a.date?a.date.split("/"):["1","1","2026"];
    var pb=b.date?b.date.split("/"):["1","1","2026"];
    var da=new Date(parseInt(pa[2])||2026, parseInt(pa[1])-1||0, parseInt(pa[0])||1);
    var db2=new Date(parseInt(pb[2])||2026, parseInt(pb[1])-1||0, parseInt(pb[0])||1);
    return db2-da;
  });
  var h='<div class="stit">Imagerie ('+imgs.length+')</div>';
  imgs.forEach(function(img,i){
    var bid="img-body-"+i;
    h+='<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">';
    // Header - clickable
    h+='<div onclick="toggleImg(this)" data-target="'+bid+'" data-idx="'+i+'" style="padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer">';
    h+='<div style="display:flex;gap:10px;align-items:center">';
    h+='<div style="width:40px;height:40px;border-radius:10px;background:#F5F3FF;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+(img.ico||"🔬")+'</div>';
    h+='<div><div style="font-size:14px;font-weight:700">'+img.type+'</div>';
    h+='<div style="font-size:11px;color:#94A3B8;margin-top:1px">'+img.date+(img.region?" · "+img.region:"")+'</div>';
    h+='<div style="margin-top:4px">'+(img.rc==="g"?bdg("✓ "+img.res,"bgn"):bdg(img.res,"ba"))+'</div>';
    h+='</div></div>';
    h+='<span id="iarr-'+i+'" style="font-size:16px;color:#94A3B8;transition:.2s;flex-shrink:0;margin-left:8px">▼</span>';
    h+='</div>';
    // Body - hidden by default
    if(img.cr){
      h+='<div id="'+bid+'" style="display:none;border-top:1px solid #F1F5F9;padding:14px">';
      h+='<div style="font-size:13px;color:#334155;line-height:1.6">'+img.cr+'</div>';
      h+='</div>';
    } else {
      h+='<div id="'+bid+'" style="display:none"></div>';
    }
    h+='</div>';
  });
  return h;
}

function toggleImg(el){
  var bid=el.getAttribute("data-target");
  var i=el.getAttribute("data-idx");
  var body=document.getElementById(bid);
  var arr=document.getElementById("iarr-"+i);
  if(!body) return;
  if(body.style.display==="none"){
    body.style.display="block";
    if(arr) arr.style.transform="rotate(180deg)";
  } else {
    body.style.display="none";
    if(arr) arr.style.transform="";
  }
}

      + '<button onclick="location.reload()" style="background:#0F766E;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">🔄 Réessayer</button>';
    document.body.appendChild(err);

function printBilanMobile() {
  var p = PAT;
  if (!p) return;

  var cons_count = DB.consultations && DB.consultations[p.id] ? DB.consultations[p.id].length : 0;
  var lab_count = DB.labos && DB.labos[p.id] ? DB.labos[p.id].length : 0;
  var img_count = DB.imagerie && DB.imagerie[p.id] ? DB.imagerie[p.id].length : 0;
  var rx_count = DB.rx && DB.rx[p.id] ? DB.rx[p.id].length : 0;
  var hasData = cons_count > 0 || lab_count > 0 || img_count > 0 || rx_count > 0;
  if (!hasData) {
    var pid = p.id;
    var loaded = 0; var total = 4;
    function done() {
      loaded++;
      if (loaded >= total) printBilanMobile();
    }
    supaGet("consultations?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.consultations=DB.consultations||{}; DB.consultations[pid]=rows; }
      done();
    });
    supaGet("labos?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.labos=DB.labos||{}; DB.labos[pid]=rows.map(function(l){ return Object.assign({},l,{patientId:l.patient_id,res:l.resultats||[]}); }); }
      done();
    });
    supaGet("imagerie?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.imagerie=DB.imagerie||{}; DB.imagerie[pid]=rows.map(function(i){ return Object.assign({},i,{cr:i.conclusion,res:i.resultat}); }); }
      done();
    });
    supaGet("prescriptions?patient_id=eq."+pid+"&select=*&order=created_at.desc", function(rows){
      if(rows){ DB.rx=DB.rx||{}; DB.rx[pid]=rows.map(function(r){ return Object.assign({},r,{patientId:r.patient_id,s:r.statut}); }); }
      done();
    });
    return;
  }

  var cons = (DB.consultations[p.id]||[]).slice(0,3);
  var labos = (DB.labos[p.id]||[]).slice(0,2);
  var imgs = (DB.imagerie[p.id]||[]).slice(0,2);
  var rxActifs = (DB.rx[p.id]||[]).filter(function(r){return r.s==="active";});
  var rdvs = (DB.rdv||[]).filter(function(r){return r.patientId===p.id;});
  var today = new Date(); 
  var todayStr = String(today.getDate()).padStart(2,"0")+"/"+String(today.getMonth()+1).padStart(2,"0")+"/"+today.getFullYear();
  var nextRdv = rdvs.find(function(r){
    if(!r.day||!r.mo||!r.h) return false;
    var mois={"Janv":0,"Fevr":1,"Mars":2,"Avr":3,"Mai":4,"Juin":5,"Juil":6,"Aout":7,"Août":7,"Sept":8,"Oct":9,"Nov":10,"Dec":11,"Déc":11};
    var m=mois[r.mo]; if(m===undefined) return false;
    return new Date(new Date().getFullYear(),m,parseInt(r.day))>=new Date();
  });

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=5.0">'
    +'<title>Mon bilan complet</title>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{padding:16px;color:#0F172A;font-size:12px}'
    +'.header{border-bottom:2px solid #0F766E;padding-bottom:10px;margin-bottom:14px}'
    +'.logo{font-size:18px;font-weight:900;color:#0F172A}.logo span{color:#0F766E}'
    +'.doc-title{font-size:12px;font-weight:800;color:#0F766E;margin-top:2px}'
    +'.pat-box{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px;margin-bottom:12px}'
    +'.pat-name{font-size:15px;font-weight:900;margin-bottom:6px}'
    +'.pat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}'
    +'.pat-lbl{font-size:8px;color:#94A3B8;text-transform:uppercase}'
    +'.pat-val{font-size:11px;font-weight:700}'
    +'.sec-title{font-size:9px;font-weight:700;color:#0F766E;text-transform:uppercase;border-bottom:1px solid #E2E8F0;padding-bottom:3px;margin:12px 0 6px}'
    +'.tag{display:inline-block;background:#EFF6FF;color:#1D4ED8;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;margin:2px}'
    +'.tag-red{background:#FEE2E2;color:#DC2626}'
    +'.tag-or{background:#FEF3C7;color:#D97706}'
    +'.rx-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #F1F5F9;font-size:11px}'
    +'.card{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:8px;margin-bottom:6px}'
    +'.card-date{font-size:9px;font-weight:700;color:#0F766E}'
    +'.card-title{font-size:11px;font-weight:700;margin:2px 0}'
    +'.card-body{font-size:10px;color:#475569}'
    +'.res-bad{color:#DC2626;font-weight:700}.res-warn{color:#D97706;font-weight:700}.res-ok{color:#16A34A}'
    +'.rdv-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:6px;padding:8px}'
    +'.footer{margin-top:16px;padding-top:8px;border-top:1px solid #E2E8F0;font-size:8px;color:#94A3B8;font-style:italic}'
    +'button.print-btn{background:#0F766E;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-bottom:14px}'
    +'@media print{button{display:none}@page{margin:10mm;size:A4}}</style></head><body>'
    +'<button class="print-btn" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>'
    +'<div class="header"><div class="logo">Medi<span>Report</span></div><div class="doc-title">BILAN COMPLET PATIENT · '+todayStr+'</div></div>'
    +'<div class="pat-box"><div class="pat-name">'+p.prenom+' '+p.nom+'</div>'
    +'<div class="pat-grid">'
    +'<div><div class="pat-lbl">Date de naissance</div><div class="pat-val">'+(p.dob||"—")+'</div></div>'
    +'<div><div class="pat-lbl">Groupe sanguin</div><div class="pat-val">'+(p.groupe||"—")+'</div></div>'
    +'<div><div class="pat-lbl">Age</div><div class="pat-val">'+(p.age||"—")+' ans</div></div>'
    +'<div><div class="pat-lbl">Ville</div><div class="pat-val">'+(p.ville||"—")+'</div></div>'
    +'</div></div>';

  // Pathologies
  html += '<div class="sec-title">Pathologies & Antécédents</div>';
  html += (p.pathologies||[]).map(function(x){return '<span class="tag">'+x+'</span>';}).join("")||'<span style="color:#94A3B8;font-size:10px">Aucune</span>';
  if((p.allergies||[]).filter(Boolean).length) html += '<br/><strong style="font-size:9px;color:#DC2626">Allergies :</strong> '+(p.allergies||[]).filter(Boolean).map(function(x){return '<span class="tag tag-red">⚠ '+x+'</span>';}).join("");
  if((p.antecedents||[]).filter(Boolean).length) html += '<br/><strong style="font-size:9px;color:#D97706">Antécédents :</strong> '+(p.antecedents||[]).filter(Boolean).map(function(x){return '<span class="tag tag-or">'+x+'</span>';}).join("");

  // Traitements
  html += '<div class="sec-title">Traitements en cours ('+rxActifs.length+')</div>';
  html += rxActifs.length ? rxActifs.map(function(r){return '<div class="rx-row"><div><strong>'+r.med+'</strong> <span style="color:#64748B">'+r.dos+'</span><br/><span style="color:#475569;font-size:10px">'+r.pos+'</span></div><span style="font-size:10px;color:#64748B">'+(r.ind||"")+'</span></div>';}).join("") : '<div style="color:#94A3B8;font-size:10px">Aucun traitement actif</div>';

  // Consultations
  html += '<div class="sec-title">Dernières consultations</div>';
  html += cons.length ? cons.map(function(c){
    var drNom = (function(id){ var u=DB.users.find(function(x){return x.id===id;}); return u?((u.titre?u.titre+" ":"")+u.prenom+" "+u.nom):id; })(c.dr||"");
    return '<div class="card"><div class="card-date">'+c.date+' · '+drNom+' · '+(c.spec||"")+'</div><div class="card-title">'+(c.motif||"")+'</div><div class="card-body">'+(c.cr||"")+'</div></div>';
  }).join("") : '<div style="color:#94A3B8;font-size:10px">Aucune consultation</div>';

  // Labos
  html += '<div class="sec-title">Derniers résultats labo</div>';
  html += labos.length ? labos.map(function(l){
    var res = l.res||l.resultats||[];
    var laboNom = (function(id){ var u=DB.users.find(function(x){return x.id===id;}); return u?(u.structure||u.nom||id):id; })(l.labo||l.ref||"");
    return '<div class="card"><div class="card-date">'+l.date+' · '+laboNom+'</div>'
      +res.map(function(r){return '<div style="display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px solid #F1F5F9"><span>'+r.p+'</span><span class="'+(r.s==="bad"?"res-bad":r.s==="warn"?"res-warn":"res-ok")+'">'+r.v+' '+r.u+' <span style="color:#94A3B8">('+r.n+')</span></span></div>';}).join("")
      +'</div>';
  }).join("") : '<div style="color:#94A3B8;font-size:10px">Aucun résultat labo</div>';

  // Imagerie
  html += '<div class="sec-title">Imagerie</div>';
  html += imgs.length ? imgs.map(function(i){
    var centreNom = (function(id){ var u=DB.users.find(function(x){return x.id===id;}); return u?(u.structure||u.nom||id):id; })(i.centre||"");
    return '<div class="card"><div class="card-date">'+i.date+' · '+centreNom+'</div><div class="card-title">'+(i.type||"")+'</div><div class="card-body">'+(i.conclusion||i.cr||"")+'</div></div>';
  }).join("") : '<div style="color:#94A3B8;font-size:10px">Aucune imagerie</div>';

  // Prochain RDV
  if(nextRdv){
    html += '<div class="sec-title">Prochain rendez-vous</div>'
      +'<div class="rdv-box"><div style="font-size:12px;font-weight:700">📅 '+nextRdv.day+' '+nextRdv.mo+' à '+nextRdv.h+'</div>'
      +'<div style="font-size:10px;color:#475569;margin-top:2px">'+(nextRdv.spec||"")+' · '+(nextRdv.lieu||"")+'</div>'
      +'<div style="font-size:10px;color:#64748B">'+(nextRdv.motif||"")+'</div></div>';
  }

  html += '<div class="footer">MediReport · Document confidentiel · Usage médical uniquement · '+todayStr+'</div>';
  html += '</body></html>';

  // Ouvrir dans la même fenêtre pour éviter le blocage mobile
  var w = window.open("", "_blank");
  if (w) { w.document.write(html); w.document.close(); }
}
